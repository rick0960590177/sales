            const [orderCompleted, setOrderCompleted] = useState(null);
            
            // History & Admin state
            const [ordersHistory, setOrdersHistory] = useState(() => {
                try {
                    const saved = localStorage.getItem('viebucks_orders');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [receiptModalOrder, setReceiptModalOrder] = useState(null);

                try {
                    localStorage.setItem('viebucks_orders', JSON.stringify(ordersHistory));
                } catch(e) {}
            }, [ordersHistory]);

            // Total cart items count
            const cartCount = useMemo(() => {
                return cart.reduce((sum, item) => sum + item.quantity, 0);
            }, [cart]);

            // Cart subtotal calculation (applies wholesale price if item quantity >= 10)
            const cartSubtotal = useMemo(() => {
                return cart.reduce((sum, item) => {
                    const price = item.quantity >= 10 ? item.wholesalePrice : item.retailPrice;
                    return sum + (price * item.quantity);
                }, 0);
            }, [cart]);

            const shippingFee = cartSubtotal >= 500000 || cartSubtotal === 0 ? 0 : 30000;
            const cartTotal = cartSubtotal + shippingFee;

            // Add to cart handler
            const handleAddToCart = (product, qty = 1) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => 
                            item.id === product.id ? { ...item, quantity: item.quantity + qty } : item
                        );
                    }
                    return [...prev, { ...product, quantity: qty }];
                });
                setIsCartOpen(true);
            };

            const updateQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            // Checkout submission
            const handleCheckoutSubmit = async (e) => {
                e.preventDefault();
                if (!customerInfo.name || !customerInfo.phone || !customerInfo.address) {
                    alert(lang === 'zh' ? '請完整填寫收件資訊' : 'Vui lòng điền đầy đủ thông tin giao hàng');
                    return;
                }

                const newOrder = {
                    orderNo: 'VB' + Date.now().toString().slice(-8),
                    date: new Date().toLocaleString(),
                    customer: customerInfo,
                    items: cart.map(i => ({
                        id: i.id,
                        name: i.name[lang],
                        quantity: i.quantity,
                        unitPrice: i.quantity >= 10 ? i.wholesalePrice : i.retailPrice
                    })),
                    subtotal: cartSubtotal,
                    shipping: shippingFee,
                    total: cartTotal,
                    status: 'pending'
                };

                try {
                    fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newOrder)
                    }).catch(err => console.log('Google Sheet sync note:', err));
                } catch(err) {}

                setOrdersHistory(prev => [newOrder, ...prev]);
                setOrderCompleted(newOrder);
                setCart([]);
                setIsCheckingOut(false);
            };

                } else if (pwd !== null) {

            };

            });

                                <div className="bg-[#121212] p-4 rounded-xl mb-6 text-left text-xs space-y-2 border border-[#2A2A2A]">
                                    <div className="flex justify-between"><span className="text-gray-500">{t.orderNo}:</span> <span className="text-white font-mono">{orderCompleted.orderNo}</span></div>
                                    <div className="flex justify-between"><span className="text-gray-500">{t.fullName}:</span> <span className="text-white">{orderCompleted.customer.name}</span></div>
                                    <div className="flex justify-between"><span className="text-gray-500">{t.total}:</span> <span className="text-[#D4AF37] font-bold">{orderCompleted.total.toLocaleString()} VND</span></div>
                                </div>
                                <div className="flex space-x-3">
                                    <button 
                                        onClick={() => { setReceiptModalOrder(orderCompleted); setOrderCompleted(null); }}
                                        className="flex-1 py-3 rounded-xl border border-[#2A2A2A] bg-[#252525] text-gray-200 text-xs font-medium hover:border-[#D4AF37] transition">
                                        {t.printReceipt}
                                    </button>
                                    <button 
                                        onClick={() => setOrderCompleted(null)}
                                        className="flex-1 py-3 rounded-xl bg-[#D4AF37] text-black text-xs font-semibold hover:bg-[#C5A028] transition">
                                        {t.close}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Product Details Modal */}
                    {selectedProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                            <div className="bg-[#181818] border border-[#2A2A2A] rounded-2xl max-w-2xl w-full overflow-hidden relative">
                                <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 z-10 text-gray-400 hover:text-white bg-[#121212]/80 p-2 rounded-full">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                                <div className="grid grid-cols-1 md:grid-cols-2">
                                    <div className="bg-[#252525] h-72 md:h-full">
                                        <img src={selectedProduct.image} alt={selectedProduct.name[lang]} className="w-full h-full object-cover" />
                                    </div>
                                    <div className="p-6 flex flex-col justify-between">
                                        <div>
                                            <h3 className="text-xl font-bold text-white mb-2">{selectedProduct.name[lang]}</h3>
                                            <p className="text-sm text-gray-400 mb-6">{selectedProduct.desc[lang]}</p>
                                            
                                            <div className="space-y-2 text-xs text-gray-300 border-t border-b border-[#2A2A2A] py-4 mb-6">
                                                <div className="flex justify-between"><span className="text-gray-500">{t.origin}:</span> <span>{selectedProduct.origin[lang]}</span></div>
                                                <div className="flex justify-between"><span className="text-gray-500">{t.process}:</span> <span>{selectedProduct.process[lang]}</span></div>
                                                <div className="flex justify-between"><span className="text-gray-500">{t.altitude}:</span> <span>{selectedProduct.altitude}</span></div>
                                                <div className="flex justify-between"><span className="text-gray-500">{t.roast}:</span> <span>{selectedProduct.roast[lang]}</span></div>
                                                <div className="flex justify-between"><span className="text-gray-500">{t.tastingNotes}:</span> <span className="text-[#D4AF37]">{selectedProduct.notes[lang]}</span></div>
                                            </div>
                                        </div>

                                        <div>
                                            <div className="flex justify-between items-baseline mb-4">
                                                <div>
                                                    <span className="text-xs text-gray-500 block">{t.retail}</span>
                                                    <span className="text-xl font-bold text-white">{selectedProduct.retailPrice.toLocaleString()} VND</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-xs text-[#D4AF37] block">{t.wholesale}</span>
                                                    <span className="text-sm font-semibold text-[#D4AF37]">{selectedProduct.wholesalePrice.toLocaleString()} VND</span>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => { handleAddToCart(selectedProduct); setSelectedProduct(null); }}
                                                className="w-full py-3 rounded-xl bg-[#D4AF37] text-black font-semibold hover:bg-[#C5A028] transition flex items-center justify-center space-x-2">
                                                <i data-lucide="shopping-bag" className="w-4 h-4"></i>
                                                <span>{t.addToCart}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Order History Modal */}
                    {showHistoryModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                            <div className="bg-[#181818] border border-[#2A2A2A] rounded-2xl max-w-3xl w-full p-6 max-h-[90vh] flex flex-col relative">
                                <div className="flex items-center justify-between pb-4 border-b border-[#2A2A2A]">
                                    <h3 className="text-xl font-bold text-white flex items-center space-x-2">
                                        <i data-lucide="clipboard-list" className="w-5 h-5 text-[#D4AF37]"></i>
                                        <span>{t.orderHistory}</span>
                                    </h3>
                                    <button onClick={() => setShowHistoryModal(false)} className="text-gray-400 hover:text-white">
                                        <i data-lucide="x" className="w-6 h-6"></i>
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto py-4 space-y-4">
                                    {ordersHistory.length === 0 ? (
                                        <div className="text-center py-16 text-gray-500">
                                            <p>{lang === 'zh' ? '目前尚無歷史訂單紀錄' : 'Chưa có lịch sử đơn hàng'}</p>
                                        </div>
                                    ) : (
                                        ordersHistory.map(ord => (
                                            <div key={ord.orderNo} className="bg-[#1E1E1E] border border-[#2A2A2A] p-4 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                                <div>
                                                    <div className="flex items-center space-x-3 mb-1">
                                                        <span className="font-mono font-bold text-white text-sm">{ord.orderNo}</span>
                                                        <span className="px-2 py-0.5 rounded text-[10px] bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">{t.pending}</span>
                                                    </div>
                                                    <p className="text-xs text-gray-400">{ord.customer.name} | {ord.customer.phone}</p>
                                                    <p className="text-xs text-gray-500 mt-1">{ord.date}</p>
                                                </div>
                                                <div className="flex items-center space-x-4">
                                                    <div className="text-right">
                                                        <span className="text-xs text-gray-500 block">{t.total}</span>
                                                        <span className="text-sm font-bold text-[#D4AF37]">{ord.total.toLocaleString()} VND</span>
                                                    </div>
                                                    <button 
                                                        onClick={() => setReceiptModalOrder(ord)}
                                                        className="px-4 py-2 rounded-lg bg-[#252525] border border-[#2A2A2A] text-gray-200 text-xs font-medium hover:border-[#D4AF37] transition">
                                                        {t.printReceipt}
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Printable Receipt Modal */}
                    {receiptModalOrder && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                            <div className="bg-[#181818] border border-[#2A2A2A] rounded-2xl max-w-md w-full p-6 relative">
                                <button onClick={() => setReceiptModalOrder(null)} className="absolute top-4 right-4 text-gray-400 hover:text-white">
                                    <i data-lucide="x" className="w-6 h-6"></i>
                                </button>
                                
                                {/* Printable Area */}
                                <div id="printable-receipt" className="bg-white text-black p-6 rounded-xl font-sans mb-6">
                                    <div className="text-center mb-6 border-b pb-4">
                                        <h2 className="text-xl font-bold tracking-wider">VIEBUCKS CAFE</h2>
                                        <p className="text-xs text-gray-500">Artisanal Coffee Shop</p>
                                        <p className="text-xs text-gray-500 mt-1">{receiptModalOrder.date}</p>
                                    </div>
                                    <div className="mb-4 text-xs space-y-1">
                                        <p><strong>{t.orderNo}:</strong> {receiptModalOrder.orderNo}</p>
                                        <p><strong>{t.fullName}:</strong> {receiptModalOrder.customer.name}</p>
                                        <p><strong>{t.phone}:</strong> {receiptModalOrder.customer.phone}</p>
                                        <p><strong>{t.address}:</strong> {receiptModalOrder.customer.address}</p>
                                    </div>
                                    <div className="border-t border-b py-2 mb-4">
                                        <table className="w-full text-xs">
                                            <thead>
                                                <tr className="border-b">
                                                    <th className="text-left pb-1">Item</th>
                                                    <th className="text-center pb-1">Qty</th>
                                                    <th className="text-right pb-1">Price</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {receiptModalOrder.items.map((it, idx) => (
                                                    <tr key={idx}>
                                                        <td className="py-1">{it.name}</td>
                                                        <td className="text-center py-1">{it.quantity}</td>
                                                        <td className="text-right py-1">{(it.unitPrice * it.quantity).toLocaleString()}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="text-xs space-y-1">
                                        <div className="flex justify-between"><span>{t.subtotal}:</span> <span>{receiptModalOrder.subtotal.toLocaleString()} VND</span></div>
                                        <div className="flex justify-between"><span>{t.shipping}:</span> <span>{receiptModalOrder.shipping.toLocaleString()} VND</span></div>
                                        <div className="flex justify-between font-bold text-sm border-t pt-1"><span>{t.total}:</span> <span>{receiptModalOrder.total.toLocaleString()} VND</span></div>
                                    </div>
                                    <div className="text-center mt-6 text-[10px] text-gray-500">
                                        <p>Thank you for choosing VIEBUCKS Cafe!</p>
                                    </div>
                                </div>

                                <div className="flex space-x-3">
                                    <button 
                                        onClick={() => window.print()}
                                        className="flex-1 py-3 rounded-xl bg-[#D4AF37] text-black text-xs font-semibold hover:bg-[#C5A028] transition flex items-center justify-center space-x-1">
                                        <i data-lucide="printer" className="w-4 h-4"></i>
                                        <span>{t.printReceipt}</span>
                                    </button>
                                    <button 
                                        onClick={() => setReceiptModalOrder(null)}
                                        className="px-6 py-3 rounded-xl border border-[#2A2A2A] bg-[#252525] text-gray-200 text-xs font-medium hover:border-[#D4AF37] transition">
                                        {t.close}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
