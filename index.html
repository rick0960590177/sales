    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfbf7; color: #3d2c1d; }
    .font-serif { font-family: 'Playfair Display', serif; }
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }

        submitting: "Processing...",
        orderHistoryTitle: "Order History",

        clearHistory: "Clear History",
        confirmClear: "Are you sure you want to clear history?",
        noHistory: "No order history found",
        receiptTitle: "VIEBUCKS OFFICIAL RECEIPT",
        orderDate: "Date",
        orderId: "Order ID",
        customer: "Customer",
        item: "Item & Spec",
        qty: "Qty",
        price: "Price",
        payable: "Total Payable",
        print: "Print Receipt",
        close: "Close",
        grindOptions: {
          whole: "Whole Beans",
          espresso: "Espresso (Fine)",
          handpour: "Hand Drip / Pour Over (Medium)",
          frenchpress: "French Press (Coarse)"
        }
      }
    };

    // --- 商品與庫存資料 ---
    const INITIAL_PRODUCTS = [
      {
        id: 'p1',
        category: 'beans',
        name: 'VIEBUCKS Signature Blend',
        description: '嚴選衣索比亞與哥倫比亞產區，帶有柑橘與焦糖香氣。',
        price: 280000,
        wholesalePrice: 240000,
        stock: 50,
        specs: ['250g', '500g', '1kg']
      },
      {
        id: 'p2',
        category: 'beans',
        name: 'Da Lat Premium Arabica',
        description: '越南大勒高原頂級阿拉比卡，風味醇厚平衡、帶有莓果尾韻。',
        price: 320000,
        wholesalePrice: 270000,
        stock: 35,
        specs: ['250g', '500g']
      },
      {
        id: 'p3',
        category: 'dripBags',
        name: 'Artisanal Drip Bag Box (10pcs)',
        description: '氮气保鲜耳掛包禮盒，隨時隨地享受職人手沖口感。',
        price: 180000,
        wholesalePrice: 150000,
        stock: 80,
        specs: ['10入裝', '20入裝']
      },
      {
        id: 'p4',
        category: 'coldBrew',
        name: 'Cold Brew Concentrate Bottle',
        description: '12小時低溫萃取冷萃濃縮液，加冰塊或牛奶即可享用。',
        price: 220000,
        wholesalePrice: 190000,
        stock: 25,
        specs: ['500ml', '1L']
      }
    ];

    const SHIPPING_CONFIG = {
      FREE_THRESHOLD: 500000,
      FLAT_RATE: 30000
    };

    const ORDER_HISTORY_STORAGE_KEY = 'viebucks_order_history_v1';

    function App() {
      const [lang, setLang] = useState('zh');
      const t = TRANSLATIONS[lang];

      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [activeCategory, setActiveCategory] = useState('all');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [isHistoryOpen, setIsHistoryOpen] = useState(false);
      const [activeReceipt, setActiveReceipt] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const filteredProducts = activeCategory === 'all'
        ? products
        : products.filter(p => p.category === activeCategory);

      const addToCart = (product, selectedSpec, grindType, quantity = 1) => {
        const cartKey = `${product.id}-${selectedSpec}-${grindType}`;
        setCart(prev => {
          const existing = prev.find(item => item.cartKey === cartKey);
          if (existing) {
            return prev.map(item => item.cartKey === cartKey ? { ...item, quantity: item.quantity + quantity } : item);
          }
          return [...prev, {
            ...product,
            cartKey,
            spec: selectedSpec,
            grind: grindType,
            grindLabel: t.grindOptions[grindType],
            quantity
          }];
        });
        setIsCartOpen(true);
      };

      const updateQuantity = (cartKey, delta) => {
        setCart(prev => prev.map(item => {
          if (item.cartKey === cartKey) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const deductStock = (purchasedItems) => {
        setProducts(prev => prev.map(p => {
          const matched = purchasedItems.filter(item => item.id === p.id);
          if (matched.length > 0) {
            const totalDeducted = matched.reduce((sum, item) => sum + item.quantity, 0);
            return { ...p, stock: Math.max(0, p.stock - totalDeducted) };
          }
          return p;
        }));
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-35 bg-coffee-50/90 backdrop-blur-md border-b border-coffee-200/60">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-coffee-900 text-white flex items-center justify-center font-serif text-xl font-bold shadow-md">
                  V
                </div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-bold font-serif tracking-wide text-coffee-900">VIEBUCKS</h1>
                  <p className="text-[10px] text-coffee-600 font-medium tracking-wider uppercase">{t.brandSubtitle}</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {/* Language Switcher */}
                <div className="flex bg-coffee-100 p-1 rounded-xl border border-coffee-200">
                  {['zh', 'vi', 'en'].map(l => (
                    <button
                      key={l}
                      onClick={() => setLang(l)}
                      className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${lang === l ? 'bg-coffee-900 text-white shadow' : 'text-coffee-700 hover:text-coffee-900'}`}
                    >
                      {l.toUpperCase()}
                    </button>
                  ))}
                </div>

                {/* History Button */}
                <button
                  onClick={() => setIsHistoryOpen(true)}
                  className="p-2.5 rounded-2xl bg-coffee-100 hover:bg-coffee-200 text-coffee-800 transition-all flex items-center gap-1.5 text-xs font-bold"
                >
                  <Icons.Clock className="h-4 w-4" />
                  <span className="hidden sm:inline">{t.orderHistoryTitle}</span>
                </button>

                {/* Cart Button */}
                <button
                  onClick={() => setIsCartOpen(true)}
                  className="relative p-2.5 rounded-2xl bg-coffee-900 text-white hover:bg-coffee-800 transition-all shadow-md flex items-center gap-2"
                >
                  <Icons.ShoppingBag className="h-5 w-5" />
                  {cart.length > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 bg-amber-700 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow">
                      {cart.reduce((sum, item) => sum + item.quantity, 0)}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            {/* Notice Banner */}
            <div className="bg-coffee-200/50 border border-coffee-200 rounded-2xl p-4 flex items-center gap-3 text-xs sm:text-sm text-coffee-800">
              <Icons.Sparkles className="h-5 w-5 text-amber-800 shrink-0" />
              <span className="font-medium">{t.wholesaleNotice}</span>
            </div>

            {/* Category Filter */}
            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
              {[
                { id: 'all', label: t.allProducts },
                { id: 'beans', label: t.beans },
                { id: 'dripBags', label: t.dripBags },
                { id: 'coldBrew', label: t.coldBrew }
              ].map(cat => (
                <button
                  key={cat.id}
                  onClick={() => setActiveCategory(cat.id)}
                  className={`px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-bold whitespace-nowrap transition-all shadow-sm ${activeCategory === cat.id ? 'bg-coffee-900 text-white shadow-md' : 'bg-white text-coffee-700 border border-coffee-200 hover:bg-coffee-100'}`}
                >
                  {cat.label}
                </button>
              ))}
            </div>

            {/* Product Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              {filteredProducts.map(product => (
                <ProductCard key={product.id} product={product} onAddToCart={addToCart} t={t} />
              ))}
            </div>
          </main>

          {/* Footer */}
          <footer className="bg-coffee-100 border-t border-coffee-200/60 py-8 mt-auto">
            <div className="max-w-7xl mx-auto px-4 text-center text-xs text-coffee-600 space-y-1">
              <p className="font-bold text-coffee-800">VIEBUCKS Specialty Coffee Supply Chain</p>
              <p>© 2026 VIEBUCKS. All rights reserved. Sourced & Roasted with Passion.</p>
            </div>
          </footer>

          {/* Modals */}
          <CartDrawer
            isOpen={isCartOpen}
            onClose={() => setIsCartOpen(false)}
            cart={cart}
            updateQuantity={updateQuantity}
            onOpenCheckout={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }}
            t={t}
          />

          <CheckoutModal
            isOpen={isCheckoutOpen}
            onClose={() => setIsCheckoutOpen(false)}
            cart={cart}
            clearCart={() => setCart([])}
            products={products}
            deductStock={deductStock}
            onOpenReceipt={(order) => setActiveReceipt(order)}
            t={t}
          />

          <OrderHistoryModal
            isOpen={isHistoryOpen}
            onClose={() => setIsHistoryOpen(false)}
            onViewReceipt={(order) => setActiveReceipt(order)}
            t={t}
          />

          <ReceiptModal
            order={activeReceipt}
            onClose={() => setActiveReceipt(null)}
            t={t}
          />
        </div>
      );
    }

    function ProductCard({ product, onAddToCart, t }) {
      const [selectedSpec, setSelectedSpec] = useState(product.specs[0]);
      const [grindType, setGrindType] = useState('whole');
      const [qty, setQty] = useState(1);

      return (
        <div className="bg-white rounded-3xl p-5 border border-coffee-200/80 shadow-sm flex flex-col justify-between hover:shadow-md transition-all">
          <div className="space-y-4">
            <div className="flex justify-between items-start gap-2">
              <h3 className="font-serif font-bold text-base sm:text-lg text-coffee-900">{product.name}</h3>
              <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${product.stock > 10 ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}`}>
                Stock: {product.stock}
              </span>
            </div>

            <p className="text-xs text-coffee-600/90 leading-relaxed line-clamp-2">{product.description}</p>

            {/* Spec selector */}
            <div className="space-y-1.5">
              <label className="text-[10px] font-bold uppercase text-coffee-700">{t.spec}</label>
              <div className="flex flex-wrap gap-1.5">
                {product.specs.map(spec => (
                  <button
                    key={spec}
                    onClick={() => setSelectedSpec(spec)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${selectedSpec === spec ? 'bg-coffee-900 text-white border-coffee-900' : 'bg-gray-50 text-coffee-700 border-coffee-200 hover:bg-coffee-100'}`}
                  >
                    {spec}
                  </button>
                ))}
              </div>
            </div>

            {/* Grind selector */}
            <div className="space-y-1.5">
              <label className="text-[10px] font-bold uppercase text-coffee-700">{t.grind}</label>
              <select
                value={grindType}
                onChange={(e) => setGrindType(e.target.value)}
                className="w-full bg-gray-50 border border-coffee-200 rounded-xl p-2 text-xs font-medium text-coffee-900 focus:outline-none focus:ring-1 focus:ring-coffee-900"
              >
                <option value="whole">{t.grindOptions.whole}</option>
                <option value="espresso">{t.grindOptions.espresso}</option>
                <option value="handpour">{t.grindOptions.handpour}</option>
                <option value="frenchpress">{t.grindOptions.frenchpress}</option>
              </select>
            </div>
          </div>

          <div className="pt-5 mt-5 border-t border-coffee-100 space-y-3">
            <div className="flex justify-between items-baseline">
              <div>
                <span className="text-[10px] text-coffee-600 block">{t.retailPrice}</span>
                <span className="text-sm font-bold text-coffee-900">{product.price.toLocaleString()} VND</span>
              </div>
              <div className="text-right">
                <span className="text-[10px] text-amber-800 block">{t.wholesalePrice}</span>
                <span className="text-xs font-bold text-amber-900">{product.wholesalePrice.toLocaleString()} VND</span>
              </div>
            </div>

            <button
              onClick={() => onAddToCart(product, selectedSpec, grindType, qty)}
              disabled={product.stock <= 0}
              className="w-full bg-coffee-900 hover:bg-coffee-800 disabled:bg-gray-300 text-white font-bold py-3 rounded-2xl text-xs shadow transition-all flex items-center justify-center gap-2"
            >
              <Icons.ShoppingBag className="h-4 w-4" /> {t.addToCart}
            </button>
          </div>
        </div>
      );
    }

    function CartDrawer({ isOpen, onClose, cart, updateQuantity, onOpenCheckout, t }) {
      if (!isOpen) return null;

      const getUnitPrice = (item) => item.quantity >= 10 ? item.wholesalePrice : item.price;
      const subtotal = cart.reduce((sum, item) => sum + getUnitPrice(item) * item.quantity, 0);
      const isFreeShipping = subtotal >= SHIPPING_CONFIG.FREE_THRESHOLD || subtotal === 0;
      const shippingFee = isFreeShipping ? 0 : SHIPPING_CONFIG.FLAT_RATE;
      const grandTotal = subtotal + shippingFee;

      return (
        <div className="fixed inset-0 z-50 overflow-hidden">
          <div className="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onClick={onClose} />
          <div className="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col">
              <div className="p-6 bg-coffee-50 border-b border-coffee-200 flex items-center justify-between">
                <h2 className="text-lg font-bold font-serif text-coffee-900 flex items-center gap-2"><Icons.ShoppingBag className="h-5 w-5 text-coffee-800" /> {t.cartTitle}</h2>
                <button onClick={onClose} className="p-2 rounded-full hover:bg-coffee-200/50 transition-colors"><Icons.X className="h-5 w-5" /></button>
              </div>

              <div className="flex-1 overflow-y-auto p-6 space-y-4">
                {cart.length === 0 ? (
                  <div className="py-20 text-center text-coffee-600 space-y-2">
                    <div className="bg-coffee-100 p-4 rounded-full text-coffee-400 w-16 h-16 flex items-center justify-center mx-auto">
                      <Icons.Coffee className="h-8 w-8" />
                    </div>
                    <p className="text-sm font-medium">{t.emptyCart}</p>
                  </div>
                ) : (
                  cart.map(item => (
                    <div key={item.cartKey} className="bg-coffee-50/60 rounded-2xl p-4 flex gap-4 items-center border border-coffee-200/60 shadow-sm">
                      <div className="flex-1">
                        <h4 className="text-xs sm:text-sm font-bold text-coffee-900 line-clamp-1">{item.name} ({item.spec})</h4>
                        <p className="text-[10px] text-coffee-600 mt-0.5">{item.grindLabel}</p>
                        <div className="text-xs sm:text-sm font-bold text-coffee-900 mt-1">
                          {getUnitPrice(item).toLocaleString()} VND
                        </div>
                      </div>

                      <div className="flex items-center gap-2 bg-white rounded-xl border border-coffee-200 p-1 shadow-inner">
                        <button onClick={() => updateQuantity(item.cartKey, -1)} className="p-1 hover:bg-coffee-100 rounded-lg transition-colors"><Icons.Minus className="h-3 w-3" /></button>
                        <span className="w-6 text-center text-xs font-bold">{item.quantity}</span>
                        <button onClick={() => updateQuantity(item.cartKey, 1)} className="p-1 hover:bg-coffee-100 rounded-lg transition-colors"><Icons.Plus className="h-3 w-3" /></button>
                      </div>
                    </div>
                  ))
                )}
              </div>

              {cart.length > 0 && (
                <div className="p-5 sm:p-6 bg-coffee-50 border-t border-coffee-200 space-y-3">
                  <div className="space-y-1.5 text-xs">
                    <div className="flex justify-between text-coffee-700"><span>{t.subtotal}:</span><span>{subtotal.toLocaleString()} VND</span></div>
                    <div className="flex justify-between text-coffee-700"><span>{t.shippingFee}:</span><span>{shippingFee === 0 ? t.free : `${shippingFee.toLocaleString()} VND`}</span></div>
                    <div className="flex justify-between font-bold text-sm sm:text-base text-coffee-900 pt-2 border-t border-coffee-200">
                      <span>{t.total}:</span>
                      <span className="text-amber-800">{grandTotal.toLocaleString()} VND</span>
                    </div>
                  </div>

                  <button
                    onClick={onOpenCheckout}
                    className="w-full bg-coffee-900 hover:bg-coffee-800 text-white font-bold py-3.5 rounded-2xl shadow-md text-xs sm:text-sm transition-all flex items-center justify-center gap-2"
                  >
                    {t.checkout}
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function CheckoutModal({ isOpen, onClose, cart, clearCart, products, deductStock, onOpenReceipt, t }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');
      const [notes, setNotes] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const getUnitPrice = (item) => item.quantity >= 10 ? item.wholesalePrice : item.price;
      const subtotal = cart.reduce((sum, item) => sum + getUnitPrice(item) * item.quantity, 0);
      const isFreeShipping = subtotal >= SHIPPING_CONFIG.FREE_THRESHOLD || subtotal === 0;
      const shippingFee = isFreeShipping ? 0 : SHIPPING_CONFIG.FLAT_RATE;
      const grandTotal = subtotal + shippingFee;

      const handleSubmitOrder = (e) => {
        e.preventDefault();
        if (!name || !phone || !address) return;

        setIsSubmitting(true);
        setTimeout(() => {
          const newOrder = {
            id: Math.floor(100000 + Math.random() * 900000).toString(),
            date: new Date().toLocaleString(),
            customerName: name,
            phone,
            address,
            notes,
            items: cart.map(item => ({
              name: item.name,
              spec: item.spec,
              grindLabel: item.grindLabel,
              quantity: item.quantity,
              unitPrice: getUnitPrice(item)
            })),
            subtotal,
            shippingFee,
            grandTotal
          };

          try {
            const savedHistory = JSON.parse(localStorage.getItem(ORDER_HISTORY_STORAGE_KEY) || '[]');
            localStorage.setItem(ORDER_HISTORY_STORAGE_KEY, JSON.stringify([newOrder, ...savedHistory]));
          } catch (e) {}

          deductStock(cart);
          clearCart();
          setIsSubmitting(false);
          onClose();
          onOpenReceipt(newOrder);
        }, 800);
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4">
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={onClose} />
          <div className="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl border border-coffee-200 p-6 sm:p-8 space-y-5 max-h-[95vh] overflow-y-auto z-10">
            <button onClick={onClose} className="absolute right-4 top-4 p-2 rounded-full hover:bg-gray-100 transition-colors"><Icons.X className="h-5 w-5" /></button>

            <div>
              <h2 className="text-xl sm:text-2xl font-bold font-serif text-coffee-900">{t.customerInfo}</h2>
              <p className="text-xs text-coffee-600/80 mt-0.5">請填寫您的收件資訊以完成訂單</p>
            </div>

            <form onSubmit={handleSubmitOrder} className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase text-coffee-800 mb-1">{t.fullName}</label>
                <input
                  type="text"
                  required
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className="w-full bg-gray-50 border border-coffee-200/80 rounded-2xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-900 transition-all shadow-inner"
                  placeholder="例：Nguyễn Văn A / 張小明"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase text-coffee-800 mb-1">{t.phone}</label>
                <input
                  type="tel"
                  required
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  className="w-full bg-gray-50 border border-coffee-200/80 rounded-2xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-900 transition-all shadow-inner"
                  placeholder="例：0912345678"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase text-coffee-800 mb-1">{t.address}</label>
                <textarea
                  required
                  rows="2"
                  value={address}
                  onChange={(e) => setAddress(e.target.value)}
                  className="w-full bg-gray-50 border border-coffee-200/80 rounded-2xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-900 transition-all shadow-inner resize-none"
                  placeholder="例：District 1, HCMC"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase text-coffee-800 mb-1">{t.notes}</label>
                <input
                  type="text"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full bg-gray-50 border border-coffee-200/80 rounded-2xl p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-coffee-900 transition-all shadow-inner"
                  placeholder="例：請於下午送達 / Giao hàng buổi chiều"
                />
              </div>

              <div className="bg-coffee-50 p-4 rounded-2xl border border-coffee-100 space-y-2 text-xs">
                <div className="flex justify-between text-coffee-700"><span>{t.subtotal}:</span><span>{subtotal.toLocaleString()} VND</span></div>
                <div className="flex justify-between text-coffee-700"><span>{t.shippingFee}:</span><span>{shippingFee === 0 ? t.free : `${shippingFee.toLocaleString()} VND`}</span></div>
                <div className="flex justify-between font-bold text-sm sm:text-base text-coffee-900 pt-2 border-t border-coffee-200">
                  <span>{t.payable}</span>
                  <span className="text-amber-800">{grandTotal.toLocaleString()} VND</span>
                </div>
              </div>

              <button
                type="submit"
                disabled={isSubmitting}
                className="w-full bg-coffee-900 hover:bg-coffee-800 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 text-xs sm:text-sm"
              >
                {isSubmitting ? t.submitting : t.submitOrder}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function OrderHistoryModal({ isOpen, onClose, onViewReceipt, t }) {
      const [orders, setOrders] = useState([]);

      useEffect(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(ORDER_HISTORY_STORAGE_KEY) || '[]');
          setOrders(saved);
        } catch (e) { setOrders([]); }
      }, []);

      const clearAllHistory = () => {
        if (window.confirm(t.confirmClear)) {
          localStorage.removeItem(ORDER_HISTORY_STORAGE_KEY);
          setOrders([]);
        }
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4">
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={onClose} />
          <div className="relative w-full max-w-2xl bg-white rounded-3xl shadow-2xl border border-coffee-200 p-6 sm:p-8 space-y-5 max-h-[92vh] overflow-y-auto z-10 flex flex-col">
            <div className="flex justify-between items-center pb-4 border-b border-gray-100">
              <h2 className="text-lg sm:text-xl font-bold font-serif text-coffee-900 flex items-center gap-2"><Icons.Clock className="h-5 w-5 text-coffee-800" /> {t.orderHistoryTitle}</h2>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-gray-100 transition-colors"><Icons.X className="h-5 w-5" /></button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-3.5">
              {orders.length === 0 ? (
                <div className="py-16 text-center text-coffee-600 space-y-2">
                  <div className="bg-coffee-100 p-4 rounded-full text-coffee-400 w-16 h-16 flex items-center justify-center mx-auto">
                    <Icons.FileText className="h-8 w-8" />
                  </div>
                  <p className="text-sm font-medium">{t.noHistory}</p>
                </div>
              ) : (
                orders.map(order => (
                  <div key={order.id} className="bg-coffee-50/70 rounded-2xl p-4 border border-coffee-200/60 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div className="space-y-1">
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-coffee-900 text-sm">#{order.id}</span>
                        <span className="text-[10px] text-gray-500">{order.date}</span>
                      </div>
                      <p className="text-xs text-coffee-800 font-medium">{order.customerName} ({order.phone})</p>
                      <p className="text-xs font-bold text-amber-900">{order.grandTotal.toLocaleString()} VND</p>
                    </div>

                    <button
                      onClick={() => onViewReceipt(order)}
                      className="bg-coffee-900 hover:bg-coffee-800 text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow transition-all flex items-center justify-center gap-1.5"
                    >
                      <Icons.FileText className="h-4 w-4" /> {t.viewReceipt}
                    </button>
                  </div>
                ))
              )}
            </div>

            {orders.length > 0 && (
              <div className="pt-4 border-t border-gray-100 flex justify-end">
                <button
                  onClick={clearAllHistory}
                  className="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl text-xs transition-colors flex items-center gap-1.5"
                >
                  <Icons.Trash className="h-4 w-4" /> {t.clearHistory}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ReceiptModal({ order, onClose, t }) {
      if (!order) return null;

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4">
          <div className="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={onClose} />
          <div id="printable-receipt" className="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl border border-coffee-200 p-6 sm:p-8 space-y-6 max-h-[95vh] overflow-y-auto z-10">
            <div className="flex justify-between items-start">
              <div>
                <h2 className="text-xl font-bold font-serif text-coffee-900">VIEBUCKS</h2>
                <p className="text-[10px] text-coffee-600 uppercase tracking-wider">{t.receiptTitle}</p>
              </div>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-gray-100 transition-colors print:hidden"><Icons.X className="h-5 w-5" /></button>
            </div>

            <div className="bg-coffee-50 p-4 rounded-2xl space-y-1.5 text-xs">
              <div className="flex justify-between"><span className="text-coffee-600">{t.orderId}:</span><span className="font-bold text-coffee-900">#{order.id}</span></div>
              <div className="flex justify-between"><span className="text-coffee-600">{t.orderDate}:</span><span className="font-medium text-coffee-900">{order.date}</span></div>
              <div className="flex justify-between"><span className="text-coffee-600">{t.customer}:</span><span className="font-medium text-coffee-900">{order.customerName} ({order.phone})</span></div>
              <div className="flex justify-between"><span className="text-coffee-600">{t.address}:</span><span className="font-medium text-coffee-900 text-right max-w-[200px]">{order.address}</span></div>
            </div>

            <div className="space-y-3">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-coffee-200 text-coffee-700">
                    <th className="pb-2 font-bold">{t.item}</th>
                    <th className="pb-2 font-bold text-center">{t.qty}</th>
                    <th className="pb-2 font-bold text-right">{t.price}</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-coffee-100">
                  {order.items.map((item, idx) => (
                    <tr key={idx} className="text-coffee-800">
                      <td className="py-2.5">
                        <p className="font-bold">{item.name} ({item.spec})</p>
                        <p className="text-[10px] text-coffee-600">{item.grindLabel}</p>
                      </td>
                      <td className="py-2.5 text-center font-medium">{item.quantity}</td>
                      <td className="py-2.5 text-right font-bold">{(item.unitPrice * item.quantity).toLocaleString()} VND</td>
                    </tr>
                  ))}
                </tbody>
              </table>

              <div className="pt-3 border-t border-coffee-200 space-y-1 text-xs">
                <div className="flex justify-between text-coffee-700"><span>{t.subtotal}</span><span>{order.subtotal.toLocaleString()} VND</span></div>
                <div className="flex justify-between text-coffee-700"><span>{t.shippingFee}</span><span>{order.shippingFee === 0 ? t.free : `${order.shippingFee.toLocaleString()} VND`}</span></div>
                <div className="flex justify-between font-bold text-sm text-coffee-900 pt-2 border-t border-coffee-200">
                  <span>{t.payable}</span>
                  <span className="text-amber-800">{order.grandTotal.toLocaleString()} VND</span>
                </div>
              </div>
            </div>

            <div className="pt-4 flex gap-3 print:hidden">
              <button
                onClick={handlePrint}
                className="flex-1 bg-coffee-900 hover:bg-coffee-800 text-white font-bold py-3 rounded-2xl text-xs shadow transition-all flex items-center justify-center gap-2"
              >
                <Icons.Printer className="h-4 w-4" /> {t.print}
              </button>
              <button
                onClick={onClose}
                className="px-6 bg-coffee-100 hover:bg-coffee-200 text-coffee-800 font-bold py-3 rounded-2xl text-xs transition-all"
              >
                {t.close}
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
